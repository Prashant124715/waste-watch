<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WasteWatch — Indian Civic-Tech Waste Segregation Monitoring</title>
  <meta name="description" content="WasteWatch — The intelligent waste-segregation monitoring and civic compliance platform for Indian housing societies and municipal corporations."/>
  <link rel="stylesheet" href="./css/variables.css"/>
  <link rel="stylesheet" href="./css/base.css"/>
  <link rel="stylesheet" href="./css/components.css"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #FFF9F5 0%, #F8FAF8 100%);
      position: relative;
      padding: var(--space-6) var(--space-4);
      color: var(--text-primary);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      box-shadow: 0 10px 30px rgba(28, 37, 33, 0.08), 0 1px 3px rgba(28, 37, 33, 0.04);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px var(--color-primary-glow);
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .civic-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--color-primary-pale);
      color: var(--color-primary-dark);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      margin-top: 10px;
      border: 1px solid rgba(232, 117, 36, 0.2);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
    }

    .input-wrap .form-control {
      padding-left: 42px;
    }

    .input-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px;
    }

    .input-toggle:hover {
      color: var(--text-primary);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--color-primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px var(--color-primary-glow);
    }

    .btn-login:hover:not(:disabled) {
      background: var(--color-primary-dark);
      box-shadow: 0 6px 18px rgba(200, 91, 22, 0.35);
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      display: none;
      background: var(--color-danger-light);
      border: 1px solid rgba(220, 38, 38, 0.3);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: var(--color-danger);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 18px;
      text-align: left;
    }
    .error-msg.visible { display: block; }

    .volunteer-register-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle);
      text-align: center;
    }

    .volunteer-register-prompt {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .btn-register-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 11px 16px;
      background: #FFFFFF;
      border: 1.5px solid var(--color-primary);
      border-radius: var(--radius-md);
      color: var(--color-primary-dark);
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all var(--transition-fast);
    }

    .btn-register-link:hover {
      background: var(--color-primary-pale);
      color: var(--color-primary-dark);
      border-color: var(--color-primary-dark);
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-subtle);
    }

    .login-footer-text {
      font-size: 0.775rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .role-chips {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .role-chip {
      padding: 4px 12px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .role-chip:hover {
      border-color: var(--color-primary);
      color: var(--color-primary-dark);
      background: var(--color-primary-pale);
    }

    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">♻️</div>
        <h1 class="login-title">WasteWatch</h1>
        <p class="login-subtitle">Civic Waste Segregation & Compliance Portal</p>
        <span class="civic-badge">🇮🇳 Indian Municipal & Housing Society Platform</span>
      </div>

      <div class="error-msg" id="error-msg" role="alert"></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="username">Username or Email</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" class="form-control"
              placeholder="e.g. admin or volunteer" autocomplete="username" required/>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" class="form-control"
              placeholder="Enter your password" autocomplete="current-password" required/>
            <button type="button" class="input-toggle" id="toggle-pwd" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <span class="btn-spinner" id="btn-spinner"></span>
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <div class="volunteer-register-box">
        <p class="volunteer-register-prompt">Want to conduct housing society inspections?</p>
        <a href="./register.html" class="btn-register-link" id="link-register-volunteer">
          <span>🤝</span>
          <span>Register as Volunteer</span>
        </a>
      </div>

      <div class="login-footer">
        <p class="login-footer-text">Quick-fill demonstration accounts:</p>
        <div class="role-chips">
          <button type="button" class="role-chip" id="chip-admin" title="Fill municipal admin credentials">🔑 Admin</button>
          <button type="button" class="role-chip" id="chip-volunteer" title="Fill volunteer credentials">👷 Volunteer</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="./js/api/client.js"></script>
  <script>
    // Redirect if already logged in with valid unexpired token
    if (api.getToken() && !api.isTokenExpired()) {
      const user = JSON.parse(localStorage.getItem('ww_user') || 'null');
      if (user && user.role) {
        window.location.href = user.role === 'ADMIN'
          ? './admin/dashboard.html'
          : './volunteer/inspect.html';
      }
    }

    const form    = document.getElementById('login-form');
    const errMsg  = document.getElementById('error-msg');
    const btn     = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const spinner = document.getElementById('btn-spinner');

    function setLoading(v) {
      btn.disabled   = v;
      spinner.style.display = v ? 'block' : 'none';
      btnText.textContent   = v ? 'Signing in…' : 'Sign In';
    }

    function showError(msg) {
      errMsg.textContent = msg;
      errMsg.classList.add('visible');
    }

    function hideError() {
      errMsg.classList.remove('visible');
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      hideError();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return showError('Please fill in both username and password.');
      setLoading(true);
      try {
        const data = await api.login(username, password);
        api.setToken(data.token);
        localStorage.setItem('ww_user', JSON.stringify({
          id: data.userId || data.id,
          username: data.username,
          fullName: data.fullName,
          email: data.email,
          role: data.role
        }));
        window.location.href = data.role === 'ADMIN'
          ? './admin/dashboard.html'
          : './volunteer/inspect.html';
      } catch (err) {
        showError(err.message || 'Invalid credentials. Please try again.');
        const pwdField = document.getElementById('password');
        if (pwdField) {
          pwdField.value = '';
          pwdField.focus();
        }
      } finally {
        setLoading(false);
      }
    });

    // Toggle password visibility
    document.getElementById('toggle-pwd').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
      document.getElementById('toggle-pwd').textContent = pwd.type === 'password' ? '👁️' : '🙈';
    });

    // Quick fill chips
    document.getElementById('chip-admin').addEventListener('click', () => {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
    });
    document.getElementById('chip-volunteer').addEventListener('click', () => {
      document.getElementById('username').value = 'volunteer';
      document.getElementById('password').value = 'volunteer123';
    });
  </script>
</body>
</html>
