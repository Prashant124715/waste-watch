<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WasteWatch — Secure Login</title>
  <meta name="description" content="Sign in to WasteWatch — The intelligent waste-segregation monitoring and compliance platform for municipalities and field inspectors."/>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/base.css"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      position: relative;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      width: 800px; height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, hsla(154,72%,37%,0.12) 0%, transparent 70%);
      top: -200px; right: -200px;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, hsla(196,90%,56%,0.08) 0%, transparent 70%);
      bottom: -150px; left: -150px;
      animation: float 10s ease-in-out infinite reverse;
      pointer-events: none;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-30px) scale(1.05); }
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: hsla(222,20%,11%,0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid hsla(210,14%,50%,0.2);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 32px 80px hsla(0,0%,0%,0.5);
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, hsl(154,72%,37%), hsl(196,90%,56%));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 20px;
      box-shadow: 0 0 32px hsla(154,72%,37%,0.4);
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 20px hsla(154,72%,37%,0.3); }
      50%       { box-shadow: 0 0 40px hsla(154,72%,37%,0.6); }
    }

    .login-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, hsl(154,72%,55%), hsl(196,90%,70%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: hsl(210,12%,55%);
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: hsl(210,12%,65%);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .form-control {
      width: 100%;
      background: hsla(222,18%,14%,0.8);
      border: 1px solid hsla(210,14%,50%,0.25);
      border-radius: 10px;
      padding: 14px 16px;
      color: hsl(210,20%,94%);
      font-size: 0.9375rem;
      transition: all 0.2s ease;
      outline: none;
    }
    .form-control:focus {
      border-color: hsl(154,72%,37%);
      box-shadow: 0 0 0 4px hsla(154,72%,37%,0.2);
      background: hsla(222,18%,16%,0.9);
    }
    .form-control::placeholder { color: hsl(210,10%,40%); }

    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: hsl(210,10%,45%);
      font-size: 1rem;
      pointer-events: none;
    }
    .input-wrap .form-control {
      padding-left: 42px;
    }
    .input-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: hsl(210,10%,45%);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px;
      transition: color 0.2s;
    }
    .input-toggle:hover { color: hsl(210,20%,80%); }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, hsl(154,72%,37%), hsl(154,72%,28%));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 8px;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 16px hsla(154,72%,37%,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, hsl(154,72%,44%), hsl(154,72%,34%));
      box-shadow: 0 6px 24px hsla(154,72%,37%,0.5);
      transform: translateY(-2px);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      display: none;
      background: hsla(0,78%,58%,0.1);
      border: 1px solid hsla(0,78%,58%,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      color: hsl(0,78%,70%);
      font-size: 0.875rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .error-msg.visible { display: block; }

    .login-footer {
      text-align: center;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid hsla(210,14%,40%,0.2);
    }
    .login-footer-text {
      font-size: 0.8125rem;
      color: hsl(210,10%,45%);
    }

    /* Role chips */
    .role-chips {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: center;
    }
    .role-chip {
      padding: 4px 12px;
      background: hsla(210,14%,50%,0.12);
      border: 1px solid hsla(210,14%,50%,0.2);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: hsl(210,12%,55%);
      cursor: pointer;
      transition: all 0.2s;
    }
    .role-chip:hover {
      border-color: hsla(154,72%,37%,0.5);
      color: hsl(154,72%,60%);
      background: hsla(154,72%,37%,0.1);
    }

    /* Spinner */
    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">♻️</div>
        <h1 class="login-title">WasteWatch</h1>
        <p class="login-subtitle">Compliance Monitoring Platform</p>
      </div>

      <div class="error-msg" id="error-msg" role="alert"></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="username">Username or Email</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" class="form-control"
              placeholder="admin or volunteer" autocomplete="username" required/>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" class="form-control"
              placeholder="Enter your password" autocomplete="current-password" required/>
            <button type="button" class="input-toggle" id="toggle-pwd" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <span class="btn-spinner" id="btn-spinner"></span>
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <div class="login-footer">
        <p class="login-footer-text">Quick fill dev credentials:</p>
        <div class="role-chips">
          <button class="role-chip" id="chip-admin" title="Fill admin credentials">🔑 Admin</button>
          <button class="role-chip" id="chip-volunteer" title="Fill volunteer credentials">👷 Volunteer</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api/client.js"></script>
  <script>
    // Redirect if already logged in
    if (api.getToken()) {
      const user = JSON.parse(localStorage.getItem('ww_user') || 'null');
      window.location.href = user?.role === 'ADMIN'
        ? '/admin/dashboard.html'
        : '/volunteer/inspect.html';
    }

    const form    = document.getElementById('login-form');
    const errMsg  = document.getElementById('error-msg');
    const btn     = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const spinner = document.getElementById('btn-spinner');

    function setLoading(v) {
      btn.disabled   = v;
      spinner.style.display = v ? 'block' : 'none';
      btnText.textContent   = v ? 'Signing in…' : 'Sign In';
    }

    function showError(msg) {
      errMsg.textContent = msg;
      errMsg.classList.add('visible');
    }

    function hideError() {
      errMsg.classList.remove('visible');
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      hideError();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return showError('Please fill in all fields.');
      setLoading(true);
      try {
        const data = await api.login(username, password);
        api.setToken(data.token);
        localStorage.setItem('ww_user', JSON.stringify({
          id: data.id, username: data.username, fullName: data.fullName,
          email: data.email, role: data.role
        }));
        window.location.href = data.role === 'ADMIN'
          ? '/admin/dashboard.html'
          : '/volunteer/inspect.html';
      } catch (err) {
        showError(err.message || 'Invalid credentials. Please try again.');
      } finally {
        setLoading(false);
      }
    });

    // Toggle password visibility
    document.getElementById('toggle-pwd').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
      document.getElementById('toggle-pwd').textContent = pwd.type === 'password' ? '👁️' : '🙈';
    });

    // Quick fill chips
    document.getElementById('chip-admin').addEventListener('click', () => {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
    });
    document.getElementById('chip-volunteer').addEventListener('click', () => {
      document.getElementById('username').value = 'volunteer';
      document.getElementById('password').value = 'volunteer123';
    });
  </script>
</body>
</html>
