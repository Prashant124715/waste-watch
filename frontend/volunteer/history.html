<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WasteWatch — My Inspection History</title>
  <meta name="description" content="Review your past inspection submissions and scores."/>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/volunteer-inspect.css"/>
  <style>
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stats-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--vw-green-border-sub, #E2ECE5);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(20, 40, 28, 0.04);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .stats-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(20, 40, 28, 0.07);
    }
    .stats-val {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }
    .stats-label {
      font-size: 0.75rem;
      color: var(--vw-text-muted, #6C8577);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .history-main-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--vw-green-border-sub, #E2ECE5);
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(22, 45, 32, 0.06), 0 2px 6px rgba(22, 45, 32, 0.02);
      padding: 24px;
      margin-bottom: 60px;
      position: relative;
      z-index: 2;
    }

    .history-main-card .toolbar {
      margin-bottom: 20px;
    }

    .history-main-card .search-box {
      background: #FFFFFF;
      border: 1.5px solid var(--vw-green-border, #D2E4D8);
      border-radius: 10px;
      transition: all var(--transition-fast);
    }
    .history-main-card .search-box:focus-within {
      border-color: var(--vw-green-accent, #34A853);
      box-shadow: 0 0 0 3px rgba(52, 168, 83, 0.12);
    }

    .history-main-card .form-control {
      border: 1.5px solid var(--vw-green-border, #D2E4D8);
      border-radius: 10px;
      background: #FFFFFF;
      color: var(--vw-text-dark, #163A29);
      font-weight: 600;
      transition: all var(--transition-fast);
    }
    .history-main-card .form-control:focus {
      border-color: var(--vw-green-accent, #34A853);
      box-shadow: 0 0 0 3px rgba(52, 168, 83, 0.12);
      outline: none;
    }

    .history-main-card .table-wrap {
      background: #FFFFFF;
      border: 1px solid var(--vw-green-border-sub, #E2ECE5);
      border-radius: 14px;
      overflow-x: auto;
    }

    .history-main-card .data-table thead th {
      background: #F4F8F5;
      color: var(--vw-text-secondary, #4B6355);
      border-bottom: 1px solid var(--vw-green-border-sub, #E2ECE5);
      font-weight: 700;
      font-size: 0.76rem;
      letter-spacing: 0.07em;
    }

    .history-main-card .data-table tbody tr {
      border-bottom: 1px solid #F0F4F1;
      transition: background var(--transition-fast);
    }
    .history-main-card .data-table tbody tr:last-child {
      border-bottom: none;
    }
    .history-main-card .data-table tbody tr:hover {
      background: var(--vw-green-mint-light, #EFF7F2);
    }

    @media (max-width: 768px) {
      .volunteer-content-area {
        padding: 20px 14px 60px;
      }
      .history-main-card {
        padding: 16px;
        border-radius: 16px;
      }
      .stats-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .stats-card {
        padding: 14px;
      }
      .stats-val {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body class="volunteer-inspect-body">

  <!-- Scenic Environmental Background Scene (Trees, Skyline, 3 Segregation Bins) -->
  <div class="inspect-bg-scene" aria-hidden="true">
    <img src="../assets/inspect-bg-scene.svg" class="inspect-bg-svg" alt=""/>
  </div>

  <!-- Main Content Wrap -->
  <div class="volunteer-main-wrap main-content">

    <!-- Topbar Header matching Reference Design -->
    <header class="volunteer-topbar">
      <div class="topbar-brand-left">
        <button class="mobile-sidebar-toggle" id="btn-toggle-sidebar" type="button" aria-label="Toggle navigation menu">
          <i data-lucide="menu" style="width:22px;height:22px;"></i>
        </button>
        <div class="topbar-icon-badge">
          <i data-lucide="clock-3" style="width:22px;height:22px;"></i>
        </div>
        <div class="topbar-titles">
          <div class="topbar-heading">My History</div>
          <div class="topbar-subheading">Your inspection records and performance</div>
        </div>
      </div>

      <div class="topbar-actions-right">
        <a href="./inspect.html" class="btn btn-primary btn-sm" style="border-radius:9999px;padding:8px 18px;display:inline-flex;align-items:center;gap:6px;font-weight:600;">
          <i data-lucide="clipboard-pen" style="width:16px;height:16px;"></i>
          <span>New Inspection</span>
        </a>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="volunteer-content-area page-content" style="align-items:stretch;max-width:1240px;margin:0 auto;width:100%;">

      <!-- My stats -->
      <div class="stats-row" id="my-stats">
        <div class="stats-card animate-pulse">
          <div class="stats-val" id="ms-total" style="color:var(--vw-green-emerald, #287A4F);">—</div>
          <div class="stats-label">Inspections</div>
        </div>
        <div class="stats-card animate-pulse">
          <div class="stats-val" id="ms-avg" style="color:var(--color-accent, #2B6CB0);">—</div>
          <div class="stats-label">Avg Score</div>
        </div>
        <div class="stats-card animate-pulse">
          <div class="stats-val" id="ms-exc" style="color:#168048;">—</div>
          <div class="stats-label">Excellent</div>
        </div>
        <div class="stats-card animate-pulse">
          <div class="stats-val" id="ms-poor" style="color:#DC2626;">—</div>
          <div class="stats-label">Poor</div>
        </div>
      </div>

      <!-- Main History Card Container -->
      <section class="history-main-card" aria-label="Inspection History Table">
        <!-- Filters -->
        <div class="toolbar">
          <div class="search-box">
            <span class="search-icon"><i data-lucide="search" class="icon-sm"></i></span>
            <input type="text" class="search-input" id="search-input" placeholder="Search by building, area…"/>
          </div>
          <select class="form-control form-control-sm" id="filter-class" style="max-width:190px;">
            <option value="">All Classifications</option>
            <option value="EXCELLENT">Excellent</option>
            <option value="GOOD">Good</option>
            <option value="NEEDS_IMPROVEMENT">Needs Improvement</option>
            <option value="POOR">Poor</option>
          </select>
          <div style="margin-left:auto;display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" id="btn-export-csv" title="Export to CSV"><i data-lucide="file-spreadsheet" class="icon-sm"></i> CSV</button>
            <button class="btn btn-secondary btn-sm" id="btn-export-pdf" title="Export to PDF"><i data-lucide="file-text" class="icon-sm"></i> PDF</button>
            <button class="btn btn-secondary btn-sm" id="btn-refresh" title="Refresh history"><i data-lucide="refresh-cw" class="icon-sm"></i></button>
          </div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Building</th>
                <th>Area</th>
                <th>Score</th>
                <th>Classification</th>
                <th>Violation</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="hist-tbody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted);">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <div id="toast-container"></div>
  <script src="../js/lucide.min.js"></script>
  <script src="../js/api/client.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/sidebar.js"></script>
  <script>
    if (!Auth.requireLogin()) throw new Error();
    injectSidebar('VOLUNTEER');

    // Mobile sidebar toggle
    const toggleSidebarBtn = document.getElementById('btn-toggle-sidebar');
    if (toggleSidebarBtn) {
      toggleSidebarBtn.addEventListener('click', () => {
        const sb = document.getElementById('sidebar');
        if (sb) sb.classList.toggle('open');
      });
    }

    const user = Auth.getUser();
    let inspections = [];

    async function loadHistory() {
      try {
        const res = await api.getInspections(user?.id ? { volunteerId: user.id } : {});
        inspections = Array.isArray(res) ? res : (res?.data || []);
        renderStats();
        render();
      } catch(e) {
        Toast.error('Error', e.message);
        document.getElementById('hist-tbody').innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--color-danger);">Failed to load</td></tr>`;
      }
    }

    function renderStats() {
      document.querySelectorAll('.stats-card').forEach(c => c.classList.remove('animate-pulse'));
      const total = inspections.length;
      const avg   = total ? Math.round(inspections.reduce((s,i) => s + (i.totalScore||0), 0) / total) : 0;
      const exc   = inspections.filter(i => i.classification === 'EXCELLENT').length;
      const poor  = inspections.filter(i => i.classification === 'POOR').length;
      document.getElementById('ms-total').textContent = total;
      document.getElementById('ms-avg').textContent   = avg + '/100';
      document.getElementById('ms-exc').textContent   = exc;
      document.getElementById('ms-poor').textContent  = poor;
    }

    function render() {
      const search  = document.getElementById('search-input').value.toLowerCase();
      const classFil = document.getElementById('filter-class').value;

      const filtered = inspections.filter(i => {
        const matchSearch = !search || [i.buildingName, i.areaName]
          .some(f => f && f.toLowerCase().includes(search));
        const matchClass  = !classFil || i.classification === classFil;
        return matchSearch && matchClass;
      });

      const tbody = document.getElementById('hist-tbody');
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-state-icon"><i data-lucide="clipboard-check" class="icon-3xl text-muted"></i></div><div class="empty-state-title">No inspections yet</div><div class="empty-state-desc">Start by conducting your first inspection!</div></div></td></tr>`;
        if (window.lucide) lucide.createIcons({ root: tbody });
        return;
      }

      tbody.innerHTML = filtered.map(i => `
        <tr>
          <td class="font-mono text-muted">#${i.id}</td>
          <td class="td-primary font-bold">${i.buildingName||'—'}</td>
          <td>${i.areaName||'—'}</td>
          <td>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="font-mono td-primary">${i.totalScore}</span>
              <div class="score-bar-wrap" style="width:60px;">
                <div class="score-bar-fill ${Fmt.classifyBadge(i.classification)}" style="width:${i.totalScore}%"></div>
              </div>
            </div>
          </td>
          <td><span class="badge badge-${Fmt.classifyBadge(i.classification)}">${Fmt.classify(i.classification)}</span></td>
          <td>${i.violationCreated ? '<span class="badge badge-danger" style="display:inline-flex;align-items:center;gap:4px;"><i data-lucide="triangle-alert" class="icon-xs"></i> Yes</span>' : '<span class="badge badge-neutral">—</span>'}</td>
          <td style="font-size:0.8rem;color:var(--text-muted)">${Fmt.datetime(i.inspectionDate)}</td>
        </tr>
      `).join('');
      if (window.lucide) lucide.createIcons({ root: tbody });
    }

    // ══════ CSV Export ══════
    function exportCSV() {
      if (!inspections.length) return Toast.warning('Export', 'No data to export.');
      const headers = ['ID','Building','Area','Score','Classification','Violation','Status','Date'];
      const rows = inspections.map(i => [
        i.id, i.buildingName, i.areaName,
        i.totalScore, i.classification, i.violationCreated ? 'Yes' : 'No',
        i.status, i.inspectionDate
      ]);
      let csv = headers.join(',') + '\n';
      rows.forEach(r => {
        csv += r.map(v => `"${(v ?? '').toString().replace(/"/g,'""')}"`).join(',') + '\n';
      });
      downloadFile(csv, 'inspections_export.csv', 'text/csv');
      Toast.success('Export', 'CSV downloaded successfully.');
    }

    // ══════ PDF Export ══════
    function exportPDF() {
      if (!inspections.length) return Toast.warning('Export', 'No data to export.');

      const total = inspections.length;
      const avg   = total ? Math.round(inspections.reduce((s,i) => s + (i.totalScore||0), 0) / total) : 0;
      const vol   = user.fullName || user.username;

      let tableRows = '';
      inspections.forEach(i => {
        tableRows += `<tr>
          <td>#${i.id}</td>
          <td>${i.buildingName||'—'}</td>
          <td>${i.areaName||'—'}</td>
          <td style="font-weight:bold;">${i.totalScore}/100</td>
          <td>${Fmt.classify(i.classification)}</td>
          <td>${i.violationCreated ? 'Yes' : 'No'}</td>
          <td>${Fmt.date(i.inspectionDate)}</td>
        </tr>`;
      });

      const html = `<!DOCTYPE html><html><head><meta charset="utf-8"/>
        <title>WasteWatch Inspection Report</title>
        <style>
          body { font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; color: #222; }
          h1 { color: #1A9D5C; margin-bottom: 4px; }
          .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
          .summary { display: flex; gap: 24px; margin-bottom: 30px; }
          .summary-item { background: #f0f9f4; border-radius: 8px; padding: 16px 24px; text-align: center; }
          .summary-val { font-size: 28px; font-weight: 800; color: #1A9D5C; }
          .summary-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
          table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 16px; }
          thead th { background: #1A9D5C; color: white; padding: 10px 8px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
          tbody td { padding: 10px 8px; border-bottom: 1px solid #eee; }
          tbody tr:nth-child(even) { background: #fafafa; }
          .footer { margin-top: 40px; font-size: 11px; color: #999; text-align: center; border-top: 1px solid #eee; padding-top: 16px; }
        </style>
      </head><body>
        <h1>WasteWatch Inspection Report</h1>
        <p class="subtitle">Volunteer: <strong>${vol}</strong> · Generated: ${new Date().toLocaleString('en-IN')}</p>
        <div class="summary">
          <div class="summary-item"><div class="summary-val">${total}</div><div class="summary-label">Inspections</div></div>
          <div class="summary-item"><div class="summary-val">${avg}%</div><div class="summary-label">Avg Score</div></div>
        </div>
        <table><thead><tr><th>ID</th><th>Building</th><th>Area</th><th>Score</th><th>Class</th><th>Violation</th><th>Date</th></tr></thead>
        <tbody>${tableRows}</tbody></table>
        <div class="footer">WasteWatch — Waste Segregation Compliance Monitoring System · Confidential</div>
      <' + '/body><' + '/html>`;

      const win = window.open('', '_blank');
      win.document.write(html);
      win.document.close();
      win.focus();
      setTimeout(() => { win.print(); }, 500);
      Toast.success('Export', 'PDF print dialog opened.');
    }

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('search-input').addEventListener('input', render);
    document.getElementById('filter-class').addEventListener('change', render);
    document.getElementById('btn-refresh').addEventListener('click', loadHistory);
    document.getElementById('btn-export-csv').addEventListener('click', exportCSV);
    document.getElementById('btn-export-pdf').addEventListener('click', exportPDF);

    if (window.lucide) lucide.createIcons();
    loadHistory();
  </script>
</body>
</html>
