<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WasteWatch — Volunteer Governance</title>
  <meta name="description" content="Manage volunteer status, activity metrics, and performance audit trails."/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <style>
    .vol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .vol-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      transition: all var(--transition-base);
      display: flex;
      flex-direction: column;
    }
    .vol-card:hover {
      border-color: var(--border-primary);
      box-shadow: var(--shadow-glow-primary);
      transform: translateY(-2px);
    }
    .vol-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .vol-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
      flex-shrink: 0;
    }
    .vol-stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.875rem;
    }
    .vol-stat-row:last-child { border-bottom: none; }
    .vol-stat-label { color: var(--text-muted); }
    .vol-stat-value { font-weight: 700; color: var(--text-primary); }
    .vol-card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Volunteer Governance</div>
        <div class="topbar-subtitle">Monitor activity, view audit productivity, and manage account statuses</div>
      </div>
    </header>
    <div class="page-content">
      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="search-input" placeholder="Search volunteer name, email, username…"/>
        </div>
        <select class="form-control form-control-sm" id="status-filter" style="max-width:180px;">
          <option value="">All Statuses</option>
          <option value="ACTIVE">Active</option>
          <option value="INACTIVE">Inactive</option>
          <option value="SUSPENDED">Suspended</option>
        </select>
        <div style="margin-left:auto;display:flex;gap:8px;">
          <button class="btn btn-secondary btn-sm" id="btn-refresh">🔄 Refresh</button>
        </div>
      </div>
      <div class="vol-grid" id="vol-grid">
        <div class="empty-state" style="grid-column:1/-1;">
          <div class="animate-pulse" style="color:var(--text-muted);">Loading volunteers…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Performance Detail Modal -->
  <div class="modal-overlay hidden" id="perf-modal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2 class="modal-title" id="perf-modal-title">Volunteer Performance</h2>
        <button class="modal-close" onclick="closeModal('perf-modal')">✕</button>
      </div>
      <div id="perf-body" style="color:var(--text-secondary);"></div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../js/api/client.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/sidebar.js"></script>
  <script>
    if (!Auth.requireAdmin()) throw new Error();
    injectSidebar('ADMIN');

    let volunteers = [];

    async function loadVolunteers() {
      try {
        const res = await api.getVolunteers();
        volunteers = res.data || res;
        renderVolunteers();
      } catch(e) {
        Toast.error('Error', e.message);
        document.getElementById('vol-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Failed to load volunteers</div></div>`;
      }
    }

    function renderVolunteers() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const statusFilter = document.getElementById('status-filter').value;

      const filtered = volunteers.filter(v => {
        const matchesSearch = [v.fullName, v.username, v.email, v.phoneNumber].some(f => f && f.toLowerCase().includes(search));
        const matchesStatus = !statusFilter || v.status === statusFilter;
        return matchesSearch && matchesStatus;
      });

      const grid = document.getElementById('vol-grid');
      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-icon">👷</div><div class="empty-state-title">No volunteers match the selected filter</div></div>`;
        return;
      }

      grid.innerHTML = filtered.map(v => {
        const isActive = v.status === 'ACTIVE';
        return `
        <div class="vol-card">
          <div class="vol-card-header">
            <div class="vol-avatar">${Fmt.avatar(v.fullName || v.username)}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-weight:700;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${v.fullName || v.username}</div>
              <div style="font-size:0.8rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">@${v.username} • ${v.email || '—'}</div>
            </div>
            <span class="badge badge-${isActive ? 'excellent' : 'poor'}">${v.status || 'ACTIVE'}</span>
          </div>

          <div class="vol-stat-row">
            <span class="vol-stat-label">Total Audits</span>
            <span class="vol-stat-value font-mono">${v.inspectionsCount ?? 0}</span>
          </div>
          <div class="vol-stat-row">
            <span class="vol-stat-label">Avg Score Awarded</span>
            <span class="vol-stat-value font-mono">${v.averageScoreGiven != null ? v.averageScoreGiven + '/100' : '—'}</span>
          </div>
          <div class="vol-stat-row">
            <span class="vol-stat-label">Rooms Audited</span>
            <span class="vol-stat-value font-mono">${v.distinctRoomsInspected ?? 0}</span>
          </div>
          <div class="vol-stat-row">
            <span class="vol-stat-label">Buildings Covered</span>
            <span class="vol-stat-value font-mono">${v.distinctBuildingsInspected ?? 0}</span>
          </div>
          <div class="vol-stat-row">
            <span class="vol-stat-label">Violations Raised</span>
            <span class="vol-stat-value font-mono" style="color:${v.violationsFlagged > 0 ? 'var(--color-danger)' : 'var(--text-primary)'}">${v.violationsFlagged ?? 0}</span>
          </div>
          <div class="vol-stat-row">
            <span class="vol-stat-label">Last Audit</span>
            <span class="vol-stat-value" style="font-size:0.8rem;">${v.lastInspectionDate ? Fmt.date(v.lastInspectionDate) : 'Never'}</span>
          </div>

          <div style="margin-top:10px;">
            <div class="score-bar-wrap">
              <div class="score-bar-fill ${v.averageScoreGiven >= 80 ? 'excellent' : v.averageScoreGiven >= 60 ? 'good' : v.averageScoreGiven >= 40 ? 'needs-improvement' : 'poor'}"
                style="width:${v.averageScoreGiven || 0}%"></div>
            </div>
          </div>

          <div class="vol-card-actions">
            <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="openPerf(${v.id})">
              📈 Statistics
            </button>
            ${isActive ? `
              <button class="btn btn-danger btn-sm" onclick="toggleStatus(${v.id}, 'INACTIVE')">
                ⏸️ Deactivate
              </button>
            ` : `
              <button class="btn btn-primary btn-sm" onclick="toggleStatus(${v.id}, 'ACTIVE')">
                ▶️ Activate
              </button>
            `}
          </div>
        </div>
      `}).join('');
    }

    async function toggleStatus(id, newStatus, name) {
      const vol = volunteers.find(x => x.id === id);
      const displayName = name || vol?.fullName || vol?.username || 'Volunteer';
      const verb = newStatus === 'ACTIVE' ? 'activate' : 'deactivate';
      if (!confirm(`Are you sure you want to ${verb} volunteer "${displayName}"?`)) return;

      try {
        await api.updateVolunteerStatus(id, newStatus);
        Toast.success('Updated', `Volunteer "${displayName}" is now ${newStatus}`);
        loadVolunteers();
      } catch (err) {
        Toast.error('Action Failed', err.message || 'Failed to update volunteer status');
      }
    }

    async function openPerf(id, name) {
      const vol = volunteers.find(x => x.id === id);
      const displayName = name || vol?.fullName || vol?.username || 'Volunteer';
      openModal('perf-modal');
      document.getElementById('perf-modal-title').textContent = displayName + ' — Statistics & Performance';
      const body = document.getElementById('perf-body');
      body.innerHTML = `<div style="display:flex;justify-content:center;padding:40px;"><div class="spinner"></div></div>`;
      try {
        const res = await api.getVolunteerPerformance(id);
        const p = res.data || res;
        body.innerHTML = `
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;">
            ${[
              ['Total Audits',        p.inspectionsCount ?? 0, 'kpi-icon-green'],
              ['Avg Score Given',     p.averageScoreGiven != null ? p.averageScoreGiven + '/100' : '—', 'kpi-icon-blue'],
              ['Violations Raised',   p.violationsFlagged ?? 0, 'kpi-icon-red'],
              ['Rooms Audited',       p.distinctRoomsInspected ?? 0, 'kpi-icon-purple'],
              ['Buildings Covered',   p.distinctBuildingsInspected ?? 0, 'kpi-icon-amber'],
              ['Status',              p.status || 'ACTIVE', 'kpi-icon-blue'],
            ].map(([label, val, cls]) => `
              <div class="kpi-card" style="padding:16px;">
                <div class="kpi-icon ${cls}" style="width:36px;height:36px;font-size:1rem;margin-bottom:8px;">${label[0]}</div>
                <div class="kpi-value" style="font-size:1.4rem;">${val}</div>
                <div class="kpi-label" style="font-size:0.75rem;">${label}</div>
              </div>
            `).join('')}
          </div>

          <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:16px;">
            <div style="font-size:0.875rem;font-weight:700;color:var(--text-primary);margin-bottom:8px;">Governance Details</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:0.85rem;">
              <div><span style="color:var(--text-muted)">Username:</span> <strong>${p.username}</strong></div>
              <div><span style="color:var(--text-muted)">Email:</span> <strong>${p.email || '—'}</strong></div>
              <div><span style="color:var(--text-muted)">Phone:</span> <strong>${p.phoneNumber || '—'}</strong></div>
              <div><span style="color:var(--text-muted)">Last Activity:</span> <strong>${p.lastInspectionDate ? Fmt.date(p.lastInspectionDate) : 'Never'}</strong></div>
            </div>
          </div>
        `;
      } catch(err) {
        body.innerHTML = `<div style="color:var(--color-danger);padding:20px;">${err.message}</div>`;
      }
    }

    document.getElementById('search-input').addEventListener('input', renderVolunteers);
    document.getElementById('status-filter').addEventListener('change', renderVolunteers);
    document.getElementById('btn-refresh').addEventListener('click', loadVolunteers);

    window.toggleStatus = toggleStatus;
    window.openPerf = openPerf;
    window.loadVolunteers = loadVolunteers;

    loadVolunteers();
  </script>
</body>
</html>
