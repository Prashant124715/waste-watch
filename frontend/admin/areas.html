<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WasteWatch — Areas & Buildings</title>
  <meta name="description" content="Manage geographic areas, buildings and rooms in WasteWatch."/>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/admin-theme.css"/>
  <script src="../js/lucide.min.js"></script>
  <style>
    .hierarchy-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      background: var(--bg-surface-2);
      border-radius: var(--radius-lg);
      padding: 4px;
      width: fit-content;
    }
    .hierarchy-tab {
      padding: 8px 20px;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      border: none;
      background: none;
      transition: all var(--transition-fast);
    }
    .hierarchy-tab.active {
      background: var(--bg-surface-3);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body class="admin-page" data-page="areas">
  <div class="admin-bg-layer" aria-hidden="true"></div>
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Areas & Buildings</div>
        <div class="topbar-subtitle">Infrastructure hierarchy management</div>
      </div>
    </header>
    <div class="page-content">

      <div class="hierarchy-tabs">
        <button class="hierarchy-tab active" data-panel="areas"><i data-lucide="map-pin" class="icon-sm"></i> Areas</button>
        <button class="hierarchy-tab" data-panel="buildings"><i data-lucide="building-2" class="icon-sm"></i> Buildings</button>
      </div>

      <!-- AREAS -->
      <div class="panel active" id="panel-areas">
        <div class="toolbar">
          <div class="search-box">
            <span class="search-icon"><i data-lucide="search"></i></span>
            <input type="text" class="search-input" id="search-areas" placeholder="Search areas…"/>
          </div>
          <div style="margin-left:auto;">
            <button class="btn btn-primary btn-sm" id="btn-add-area">+ Add Area</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Code</th><th>Name</th><th>City</th><th>Pincode</th><th>Actions</th></tr></thead>
            <tbody id="areas-tbody"><tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted);">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- BUILDINGS -->
      <div class="panel" id="panel-buildings">
        <div class="toolbar">
          <div class="search-box">
            <span class="search-icon"><i data-lucide="search"></i></span>
            <input type="text" class="search-input" id="search-buildings" placeholder="Search buildings…"/>
          </div>
          <select class="form-control form-control-sm" id="filter-area" style="max-width:200px;"><option value="">All Areas</option></select>
          <div style="margin-left:auto;">
            <button class="btn btn-primary btn-sm" id="btn-add-building">+ Add Building</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Code</th><th>Name</th><th>Area</th><th>Type</th><th>Floors</th><th>Actions</th></tr></thead>
            <tbody id="buildings-tbody"><tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted);">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Area Modal -->
  <div class="modal-overlay hidden" id="area-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="area-modal-title">Add Area</h2>
        <button class="modal-close" onclick="closeModal('area-modal')" aria-label="Close modal"><i data-lucide="x"></i></button>
      </div>
      <form id="area-form">
        <input type="hidden" id="area-id"/>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Area Code <span class="required">*</span></label>
            <input type="text" class="form-control" id="area-code" placeholder="ZONE-N-01" required/>
          </div>
          <div class="form-group">
            <label class="form-label">City <span class="required">*</span></label>
            <input type="text" class="form-control" id="area-city" placeholder="Metro City" required/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Area Name <span class="required">*</span></label>
          <input type="text" class="form-control" id="area-name" placeholder="North Ward – Sector 5" required/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Pincode <span class="required">*</span></label>
            <input type="text" class="form-control" id="area-pincode" placeholder="400001" required/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="area-desc" rows="2" placeholder="Brief description of the area…"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('area-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="area-submit-btn">Save Area</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Building Modal -->
  <div class="modal-overlay hidden" id="building-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="building-modal-title">Add Building</h2>
        <button class="modal-close" onclick="closeModal('building-modal')" aria-label="Close modal"><i data-lucide="x"></i></button>
      </div>
      <form id="building-form">
        <input type="hidden" id="building-id"/>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Building Code <span class="required">*</span></label>
            <input type="text" class="form-control" id="bld-code" placeholder="BLD-NW-101" required/>
          </div>
          <div class="form-group">
            <label class="form-label">Area <span class="required">*</span></label>
            <select class="form-control" id="bld-area" required></select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Building Name <span class="required">*</span></label>
          <input type="text" class="form-control" id="bld-name" placeholder="Green Heights Tower A" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Address <span class="required">*</span></label>
          <input type="text" class="form-control" id="bld-address" placeholder="42 Pine St, Sector 14" required/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Latitude</label>
            <input type="number" class="form-control" id="bld-lat" step="0.0000001" placeholder="19.0760"/>
          </div>
          <div class="form-group">
            <label class="form-label">Longitude</label>
            <input type="number" class="form-control" id="bld-lng" step="0.0000001" placeholder="72.8777"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Building Type <span class="required">*</span></label>
            <select class="form-control" id="bld-type" required>
              <option value="RESIDENTIAL">Residential</option>
              <option value="COMMERCIAL">Commercial</option>
              <option value="INDUSTRIAL">Industrial</option>
              <option value="MIXED">Mixed Use</option>
              <option value="EDUCATIONAL">Educational</option>
              <option value="HEALTHCARE">Healthcare</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Total Floors <span class="required">*</span></label>
            <input type="number" class="form-control" id="bld-floors" min="1" placeholder="5" required/>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('building-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="bld-submit-btn">Save Building</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../js/api/client.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/sidebar.js"></script>
  <script>
    if (!Auth.requireAdmin()) throw new Error();
    injectSidebar('ADMIN');

    let areas = [], buildings = [], rooms = [];

    // ── Tabs ──
    document.querySelectorAll('.hierarchy-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.hierarchy-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
      });
    });

    // ════════════ AREAS ════════════
    async function loadAreas() {
      try {
        areas = await api.getAreas();
        renderAreas();
        populateAreaFilters();
      } catch(e) { Toast.error('Areas Error', e.message); }
    }

    function renderAreas() {
      const search = document.getElementById('search-areas').value.toLowerCase();
      const filtered = areas.filter(a =>
        [a.areaCode, a.name, a.city].some(f => f && f.toLowerCase().includes(search))
      );
      const tbody = document.getElementById('areas-tbody');
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-state-icon"><i data-lucide="map-pin" class="icon-3xl"></i></div><div class="empty-state-title">No areas found</div></div></td></tr>`;
        if (window.lucide) lucide.createIcons({ root: tbody });
        return;
      }
      tbody.innerHTML = filtered.map(a => `
        <tr>
          <td class="font-mono">${a.areaCode}</td>
          <td class="td-primary">${a.name}</td>
          <td>${a.city}</td>
          <td class="font-mono">${a.pincode}</td>
          <td style="display:flex;gap:6px;">
            <button class="btn btn-secondary btn-sm btn-icon" onclick="editArea(${a.id})" title="Edit Area" aria-label="Edit Area"><i data-lucide="pencil" class="icon-sm"></i></button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="deleteArea(${a.id})" title="Delete Area" aria-label="Delete Area"><i data-lucide="trash-2" class="icon-sm"></i></button>
          </td>
        </tr>
      `).join('');
      if (window.lucide) lucide.createIcons({ root: tbody });
    }

    function populateAreaFilters() {
      const sel = document.getElementById('filter-area');
      const bldSel = document.getElementById('bld-area');
      const opts = areas.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
      sel.innerHTML = '<option value="">All Areas</option>' + opts;
      bldSel.innerHTML = '<option value="">Select Area…</option>' + opts;
    }

    document.getElementById('search-areas').addEventListener('input', renderAreas);
    document.getElementById('btn-add-area').addEventListener('click', () => {
      document.getElementById('area-form').reset();
      document.getElementById('area-id').value = '';
      document.getElementById('area-modal-title').textContent = 'Add Area';
      openModal('area-modal');
    });

    function editArea(id) {
      const a = areas.find(x => x.id === id);
      if (!a) return;
      document.getElementById('area-id').value = id;
      document.getElementById('area-code').value = a.areaCode;
      document.getElementById('area-name').value = a.name;
      document.getElementById('area-city').value = a.city;
      document.getElementById('area-pincode').value = a.pincode;
      document.getElementById('area-desc').value = a.description || '';
      document.getElementById('area-modal-title').textContent = 'Edit Area';
      openModal('area-modal');
    }

    async function deleteArea(id, name) {
      const item = areas.find(x => x.id === id);
      const displayName = name || item?.name || 'Area';
      if (!confirm(`Delete area "${displayName}"? This cannot be undone.`)) return;
      try {
        await api.deleteArea(id);
        Toast.success('Deleted', `Area "${displayName}" was removed.`);
        loadAreas();
      } catch(e) { Toast.error('Delete Failed', e.message); }
    }

    document.getElementById('area-form').addEventListener('submit', async e => {
      e.preventDefault();
      const id = document.getElementById('area-id').value;
      const data = {
        areaCode: document.getElementById('area-code').value.trim(),
        name: document.getElementById('area-name').value.trim(),
        city: document.getElementById('area-city').value.trim(),
        pincode: document.getElementById('area-pincode').value.trim(),
        description: document.getElementById('area-desc').value.trim() || undefined,
      };
      const btn = document.getElementById('area-submit-btn');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        if (id) await api.updateArea(id, data); else await api.createArea(data);
        closeModal('area-modal');
        Toast.success('Saved', 'Area saved successfully.');
        loadAreas();
      } catch(e) { Toast.error('Save Failed', e.message); }
      finally { btn.disabled = false; btn.textContent = 'Save Area'; }
    });

    // ════════════ BUILDINGS ════════════
    async function loadBuildings() {
      try {
        buildings = await api.getBuildings();
        renderBuildings();
        populateBuildingFilter();
      } catch(e) { Toast.error('Buildings Error', e.message); }
    }

    function renderBuildings() {
      const search = document.getElementById('search-buildings').value.toLowerCase();
      const areaId = document.getElementById('filter-area').value;
      const filtered = buildings.filter(b => {
        const match = !search || [b.buildingCode, b.name, b.address].some(f => f && f.toLowerCase().includes(search));
        const area  = !areaId || String(b.areaId) === String(areaId);
        return match && area;
      });
      const tbody = document.getElementById('buildings-tbody');
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-state-icon"><i data-lucide="building-2" class="icon-3xl"></i></div><div class="empty-state-title">No buildings found</div></div></td></tr>`;
        if (window.lucide) lucide.createIcons({ root: tbody });
        return;
      }
      tbody.innerHTML = filtered.map(b => `
        <tr>
          <td class="font-mono">${b.buildingCode}</td>
          <td class="td-primary">${b.name}</td>
          <td>${b.areaName || '—'}</td>
          <td><span class="badge badge-neutral">${Fmt.buildingType(b.buildingType)}</span></td>
          <td>${b.totalFloors}</td>
          <td style="display:flex;gap:6px;">
            <button class="btn btn-secondary btn-sm btn-icon" onclick="editBuilding(${b.id})" title="Edit Building" aria-label="Edit Building"><i data-lucide="pencil" class="icon-sm"></i></button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="deleteBuilding(${b.id})" title="Delete Building" aria-label="Delete Building"><i data-lucide="trash-2" class="icon-sm"></i></button>
          </td>
        </tr>
      `).join('');
      if (window.lucide) lucide.createIcons({ root: tbody });
    }

    function populateBuildingFilter() {
      const sel = document.getElementById('filter-building');
      const roomBldSel = document.getElementById('room-building');
      const opts = buildings.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
      if (sel) sel.innerHTML = '<option value="">All Buildings</option>' + opts;
      if (roomBldSel) roomBldSel.innerHTML = '<option value="">Select Building…</option>' + opts;
    }

    document.getElementById('search-buildings').addEventListener('input', renderBuildings);
    document.getElementById('filter-area').addEventListener('change', renderBuildings);
    document.getElementById('btn-add-building').addEventListener('click', () => {
      document.getElementById('building-form').reset();
      document.getElementById('building-id').value = '';
      document.getElementById('building-modal-title').textContent = 'Add Building';
      openModal('building-modal');
    });

    function editBuilding(id) {
      const b = buildings.find(x => x.id === id);
      if (!b) return;
      document.getElementById('building-id').value = id;
      document.getElementById('bld-code').value = b.buildingCode;
      document.getElementById('bld-name').value = b.name;
      document.getElementById('bld-address').value = b.address;
      document.getElementById('bld-lat').value = b.latitude || '';
      document.getElementById('bld-lng').value = b.longitude || '';
      document.getElementById('bld-type').value = b.buildingType;
      document.getElementById('bld-floors').value = b.totalFloors;
      document.getElementById('bld-area').value = b.areaId;
      document.getElementById('building-modal-title').textContent = 'Edit Building';
      openModal('building-modal');
    }

    async function deleteBuilding(id, name) {
      const item = buildings.find(x => x.id === id);
      const displayName = name || item?.name || 'Building';
      if (!confirm(`Delete building "${displayName}"?`)) return;
      try {
        await api.deleteBuilding(id);
        Toast.success('Deleted', `Building "${displayName}" removed.`);
        loadBuildings();
      } catch(e) { Toast.error('Delete Failed', e.message); }
    }

    document.getElementById('building-form').addEventListener('submit', async e => {
      e.preventDefault();
      const id = document.getElementById('building-id').value;
      const data = {
        areaId: parseInt(document.getElementById('bld-area').value),
        buildingCode: document.getElementById('bld-code').value.trim(),
        name: document.getElementById('bld-name').value.trim(),
        address: document.getElementById('bld-address').value.trim(),
        latitude: document.getElementById('bld-lat').value ? parseFloat(document.getElementById('bld-lat').value) : undefined,
        longitude: document.getElementById('bld-lng').value ? parseFloat(document.getElementById('bld-lng').value) : undefined,
        buildingType: document.getElementById('bld-type').value,
        totalFloors: parseInt(document.getElementById('bld-floors').value),
      };
      const btn = document.getElementById('bld-submit-btn');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        if (id) await api.updateBuilding(id, data); else await api.createBuilding(data);
        closeModal('building-modal');
        Toast.success('Saved', 'Building saved successfully.');
        loadBuildings();
      } catch(e) { Toast.error('Save Failed', e.message); }
      finally { btn.disabled = false; btn.textContent = 'Save Building'; }
    });

    // ── Global exports ──
    window.deleteArea = deleteArea;
    window.deleteBuilding = deleteBuilding;
    window.editArea = editArea;
    window.editBuilding = editBuilding;

    // ── Init ──
    Promise.all([loadAreas(), loadBuildings()]);
  </script>
</body>
</html>
