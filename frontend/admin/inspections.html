<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WasteWatch — All Inspections</title>
  <meta name="description" content="Browse all historical room inspection records in WasteWatch."/>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/admin-theme.css"/>
  <script src="../js/lucide.min.js"></script>
</head>
<body class="admin-page" data-page="inspections">
  <div class="admin-bg-layer" aria-hidden="true"></div>
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Inspections</div>
        <div class="topbar-subtitle">Historical field audit records</div>
      </div>
    </header>
    <div class="page-content">
      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon"><i data-lucide="search"></i></span>
          <input type="text" class="search-input" id="search-input" placeholder="Search building, area, or inspector…"/>
        </div>
        <select class="form-control form-control-sm" id="classification-filter" style="max-width:200px;">
          <option value="">All Classifications</option>
          <option value="EXCELLENT">Excellent</option>
          <option value="GOOD">Good</option>
          <option value="NEEDS_IMPROVEMENT">Needs Improvement</option>
          <option value="POOR">Poor</option>
        </select>
        <div style="margin-left:auto;display:flex;gap:8px;">
          <button class="btn btn-secondary btn-sm" id="btn-export-csv"><i data-lucide="file-spreadsheet"></i> CSV</button>
          <button class="btn btn-secondary btn-sm" id="btn-export-pdf"><i data-lucide="file-text"></i> PDF</button>
          <button class="btn btn-secondary btn-sm" id="btn-refresh"><i data-lucide="refresh-cw"></i> Refresh</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Building</th>
              <th>Area</th>
              <th>Inspector</th>
              <th>Score</th>
              <th>Classification</th>
              <th>Status</th>
              <th>Violation</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="inspections-tbody">
            <tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Inspection Detail Modal -->
  <div class="modal-overlay hidden" id="detail-modal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2 class="modal-title">Inspection Detail</h2>
        <button class="modal-close" onclick="closeModal('detail-modal')" aria-label="Close modal"><i data-lucide="x"></i></button>
      </div>
      <div id="detail-body" style="color:var(--text-secondary);font-size:0.9rem;"></div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../js/api/client.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/sidebar.js"></script>
  <script>
    if (!Auth.requireAdmin()) throw new Error();
    injectSidebar('ADMIN');

    let inspections = [];

    async function loadInspections() {
      const tbody = document.getElementById('inspections-tbody');
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);">Loading…</td></tr>`;
      try {
        const res = await api.getInspections();
        inspections = Array.isArray(res) ? res : (res?.data || []);
        render();
      } catch(err) {
        Toast.error('Error', err.message || 'Failed to load inspections');
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--color-danger);">Failed to load inspections: ${escapeHtml(err.message || 'Unknown error')}</td></tr>`;
      }
    }

    function render() {
      const search  = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
      const classFil = document.getElementById('classification-filter')?.value || '';

      const list = Array.isArray(inspections) ? inspections : [];
      const filtered = list.filter(i => {
        const matchSearch = !search || [i.buildingName, i.areaName, i.volunteerName]
          .some(f => f && f.toLowerCase().includes(search));
        const matchClass = !classFil || i.classification === classFil;
        return matchSearch && matchClass;
      });

      const tbody = document.getElementById('inspections-tbody');
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><div class="empty-state-icon"><i data-lucide="clipboard-check" class="icon-3xl"></i></div><div class="empty-state-title">No inspections found</div></div></td></tr>`;
        if (window.lucide) lucide.createIcons({ root: tbody });
        return;
      }

      tbody.innerHTML = filtered.map(i => {
        return `
        <tr style="cursor:pointer;" onclick="openDetail(${i.id})">
          <td class="font-mono text-muted">#${i.id}</td>
          <td class="td-primary font-bold">${escapeHtml(i.buildingName || '—')}</td>
          <td>${escapeHtml(i.areaName || '—')}</td>
          <td>${escapeHtml(i.volunteerName || '—')}</td>
          <td>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="font-mono td-primary">${i.totalScore ?? 0}</span>
              <div class="score-bar-wrap" style="width:60px;">
                <div class="score-bar-fill ${Fmt.classifyBadge(i.classification)}" style="width:${i.totalScore ?? 0}%"></div>
              </div>
            </div>
          </td>
          <td><span class="badge badge-${Fmt.classifyBadge(i.classification)}">${Fmt.classify(i.classification)}</span></td>
          <td><span class="badge badge-${i.status === 'FLAGGED' ? 'danger' : 'neutral'}">${escapeHtml(i.status || '—')}</span></td>
          <td>${i.violationCreated ? '<span class="badge badge-danger"><i data-lucide="triangle-alert" class="icon-xs"></i> Yes</span>' : '<span class="badge badge-neutral">—</span>'}</td>
          <td style="font-size:0.8rem;color:var(--text-muted)">${Fmt.datetime(i.inspectionDate)}</td>
        </tr>
      `}).join('');
      if (window.lucide) lucide.createIcons({ root: tbody });
    }

    async function openDetail(id) {
      openModal('detail-modal');
      const body = document.getElementById('detail-body');
      body.innerHTML = '<div class="loading-overlay" style="position:relative;height:120px;background:none;"><div class="spinner"></div></div>';
      try {
        const i = await api.getInspection(id);
        const criteria = [
          { label: 'Wet Waste Separated',     value: i.wetWasteSeparated,      pts: 25 },
          { label: 'Dry Waste Separated',     value: i.dryWasteSeparated,      pts: 25 },
          { label: 'Sanitary Waste Separated', value: i.sanitaryWasteSeparated, pts: 20 },
          { label: 'Correct Bins Used',        value: i.correctBinsUsed,        pts: 15 },
          { label: 'Bins Clearly Labelled',    value: i.binsLabelled,           pts: 10 },
          { label: 'No Mixed Contamination',   value: i.noMixedWaste,           pts:  5 },
        ];
        body.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:20px;">
            <div>
              <div style="font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;">Building Location</div>
              <div style="font-size:0.9rem;color:var(--text-primary);font-weight:600;">${i.buildingName||'—'}</div>
              <div style="font-size:0.825rem;color:var(--text-secondary);">${i.areaName||'—'}</div>
            </div>
            <div>
              <div style="font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;">Inspector</div>
              <div style="font-size:0.9rem;color:var(--text-primary);font-weight:600;">${i.volunteerName||'—'}</div>
              <div style="font-size:0.825rem;color:var(--text-secondary);">${Fmt.datetime(i.inspectionDate)}</div>
            </div>
          </div>

          <div style="margin-bottom:20px;">
            ${criteria.map(c => `
              <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-subtle);">
                <span style="display:inline-flex;align-items:center;color:${c.value ? 'var(--color-success)' : 'var(--color-danger)'};"><i data-lucide="${c.value ? 'check-circle-2' : 'x-circle'}" class="icon-md"></i></span>
                <span style="flex:1;font-size:0.875rem;color:${c.value ? 'var(--text-primary)' : 'var(--text-muted)'};">${c.label}</span>
                <span style="font-size:0.8rem;font-weight:700;color:${c.value ? 'var(--color-primary-light)' : 'var(--text-muted)'};">${c.value ? '+'+c.pts : '0'} pts</span>
              </div>`).join('')}
          </div>

          <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-surface-2);border-radius:12px;padding:16px 20px;margin-bottom:16px;">
            <div>
              <div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;">Total Score</div>
              <div style="font-size:2.5rem;font-weight:800;letter-spacing:-0.04em;color:var(--text-primary);">${i.totalScore}<span style="font-size:1rem;color:var(--text-muted)">/100</span></div>
            </div>
            <span class="badge badge-${Fmt.classifyBadge(i.classification)}" style="font-size:0.9rem;padding:6px 14px;">${Fmt.classify(i.classification)}</span>
          </div>

          ${i.remarks ? `<div style="background:var(--bg-surface-2);border-radius:10px;padding:14px;margin-bottom:12px;font-size:0.875rem;color:var(--text-secondary);">
            <strong>Remarks:</strong> ${i.remarks}
          </div>` : ''}

          ${i.violationCreated ? `<div style="background:hsla(0,78%,58%,0.08);border:1px solid hsla(0,78%,58%,0.25);border-radius:10px;padding:14px;font-size:0.875rem;color:hsl(0,78%,70%);display:flex;align-items:center;gap:8px;">
            <i data-lucide="triangle-alert" class="icon-md"></i>
            <div>A violation was automatically generated for this inspection (Violation #${i.violationId}).</div>
          </div>` : ''}
        `;
        if (window.lucide) lucide.createIcons({ root: body });
      } catch(err) {
        body.innerHTML = `<div style="color:var(--color-danger);padding:20px;">${err.message}</div>`;
      }
    }

    document.getElementById('search-input').addEventListener('input', render);
    document.getElementById('classification-filter').addEventListener('change', render);
    document.getElementById('btn-refresh').addEventListener('click', loadInspections);

    // ── CSV Export ──
    document.getElementById('btn-export-csv').addEventListener('click', () => {
      if (!inspections.length) return Toast.warning('Export', 'No data to export.');
      const headers = ['ID','Building','Area','Inspector','Score','Classification','Status','Violation','Date'];
      const rows = inspections.map(i => [
        i.id, i.buildingName, i.areaName, i.volunteerName,
        i.totalScore, i.classification, i.status, i.violationCreated ? 'Yes' : 'No', i.inspectionDate
      ]);
      let csv = headers.join(',') + '\n';
      rows.forEach(r => { csv += r.map(v => `"${(v ?? '').toString().replace(/"/g,'""')}"`).join(',') + '\n'; });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'inspections_report.csv'; a.click();
      URL.revokeObjectURL(url);
      Toast.success('Export', 'CSV downloaded.');
    });

    // ── PDF Export ──
    document.getElementById('btn-export-pdf').addEventListener('click', () => {
      if (!inspections.length) return Toast.warning('Export', 'No data to export.');
      const total = inspections.length;
      const avg = total ? Math.round(inspections.reduce((s,i) => s + (i.totalScore||0), 0) / total) : 0;
      const violCount = inspections.filter(i => i.violationCreated).length;
      let tbody = '';
      inspections.forEach(i => {
        tbody += `<tr><td>#${i.id}</td><td>${i.buildingName||'—'}</td><td>${i.areaName||'—'}</td><td>${i.volunteerName||'—'}</td><td style="font-weight:bold;">${i.totalScore}/100</td><td>${Fmt.classify(i.classification)}</td><td>${i.violationCreated?'Yes':'—'}</td><td>${Fmt.date(i.inspectionDate)}</td></tr>`;
      });
      const html = `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>WasteWatch — Inspections Report</title>
        <style>body{font-family:'Segoe UI',Arial,sans-serif;padding:40px;color:#222;}h1{color:#1A9D5C;margin-bottom:4px;}.sub{color:#666;font-size:14px;margin-bottom:24px;}.sum{display:flex;gap:20px;margin-bottom:28px;}.sc{background:#f0f9f4;border-radius:8px;padding:16px 28px;text-align:center;}.sv{font-size:28px;font-weight:800;color:#1A9D5C;}.sl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}table{width:100%;border-collapse:collapse;font-size:12px;}thead th{background:#1A9D5C;color:white;padding:10px 6px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;}tbody td{padding:9px 6px;border-bottom:1px solid #eee;}tbody tr:nth-child(even){background:#fafafa;}.ft{margin-top:36px;font-size:10px;color:#999;text-align:center;border-top:1px solid #eee;padding-top:14px;}</style>
        </head><body><h1>WasteWatch — All Inspections Report</h1><p class="sub">Generated: ${new Date().toLocaleString('en-IN')}</p>
        <div class="sum"><div class="sc"><div class="sv">${total}</div><div class="sl">Inspections</div></div><div class="sc"><div class="sv">${avg}%</div><div class="sl">Avg Score</div></div><div class="sc"><div class="sv">${violCount}</div><div class="sl">Violations</div></div></div>
        <table><thead><tr><th>ID</th><th>Building</th><th>Area</th><th>Inspector</th><th>Score</th><th>Class</th><th>Violation</th><th>Date</th></tr></thead><tbody>${tbody}</tbody></table>
        <div class="ft">WasteWatch — Waste Segregation Compliance Monitoring System · Confidential</div><' + '/body><' + '/html>`;
      const win = window.open('', '_blank');
      win.document.write(html); win.document.close(); win.focus();
      setTimeout(() => win.print(), 500);
      Toast.success('Export', 'PDF print dialog opened.');
    });

    window.openDetail = openDetail;
    window.loadInspections = loadInspections;
    loadInspections();
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
