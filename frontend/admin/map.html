<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WasteWatch — Geographic Monitoring & Live Compliance Map</title>
  <meta name="description" content="Real-time geographic waste segregation monitoring, Leaflet.js interactive maps, and hotspot visualizer."/>
  <link rel="stylesheet" href="/css/variables.css"/>
  <link rel="stylesheet" href="/css/base.css"/>
  <link rel="stylesheet" href="/css/layout.css"/>
  <link rel="stylesheet" href="/css/components.css"/>
  <!-- Leaflet.js -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .map-container-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: var(--space-5);
      height: calc(100vh - 220px);
      min-height: 540px;
    }
    @media (max-width: 1024px) {
      .map-container-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .map-wrap {
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      height: 100%;
      min-height: 520px;
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    #map { height: 100%; width: 100%; }

    /* Custom Leaflet Markers */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      border: 2px solid #ffffff;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .custom-marker:hover {
      transform: scale(1.2);
      z-index: 1000 !important;
    }
    .marker-excellent { background: #2ECC71; }
    .marker-good      { background: #00BFFF; }
    .marker-needs-imp { background: #F39C12; }
    .marker-poor      { background: #E74C3C; }
    .marker-no-data   { background: #6B7280; }

    .marker-hotspot {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
      50% { box-shadow: 0 0 0 12px rgba(231, 76, 60, 0); }
    }

    /* Override leaflet popup */
    .leaflet-popup-content-wrapper {
      background: var(--bg-surface-2) !important;
      border: 1px solid var(--border-default) !important;
      border-radius: var(--radius-lg) !important;
      color: var(--text-primary) !important;
      box-shadow: var(--shadow-lg) !important;
      font-family: var(--font-sans) !important;
      padding: 0 !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      line-height: 1.4 !important;
    }
    .leaflet-popup-tip { background: var(--bg-surface-2) !important; }

    .popup-box {
      padding: 16px;
      min-width: 240px;
    }
    .popup-header {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .popup-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .popup-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .popup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 0.8125rem;
      border-bottom: 1px dashed var(--border-subtle);
    }
    .popup-row:last-child { border-bottom: none; }
    .popup-actions {
      margin-top: 12px;
      display: flex;
      gap: 6px;
    }

    /* Sidebar drawer for map list & unmapped buildings */
    .map-sidebar {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .map-sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .map-sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .unmapped-card {
      background: var(--bg-surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 0.8125rem;
    }
    .unmapped-card:hover {
      border-color: var(--color-warning);
    }

    .legend-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Geographic Monitoring</div>
        <div class="topbar-subtitle">Interactive Leaflet.js spatial compliance & hotspot map</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary btn-sm" id="btn-fit-all" onclick="fitAllMarkers()">🎯 Fit All</button>
        <button class="btn btn-secondary btn-sm" id="btn-refresh" onclick="loadMapData()">🔄 Refresh</button>
      </div>
    </header>

    <div class="page-content">

      <!-- Map Toolbar & Filters -->
      <div class="toolbar" style="margin-bottom:14px;flex-wrap:wrap;gap:10px;">
        <div class="search-box" style="max-width:240px;">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="search-input" placeholder="Search building…" oninput="filterMarkers()"/>
        </div>

        <select class="form-control form-control-sm" id="area-filter" onchange="filterMarkers()" style="max-width:180px;">
          <option value="">All Areas</option>
        </select>

        <select class="form-control form-control-sm" id="status-filter" onchange="filterMarkers()" style="max-width:180px;">
          <option value="">All Statuses</option>
          <option value="EXCELLENT">Excellent (80-100)</option>
          <option value="GOOD">Good (60-79)</option>
          <option value="NEEDS_IMPROVEMENT">Needs Improvement (40-59)</option>
          <option value="POOR">Poor (0-39)</option>
          <option value="NO_DATA">No Data</option>
        </select>

        <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
          <label style="display:flex;align-items:center;gap:6px;font-size:0.8125rem;color:var(--text-secondary);cursor:pointer;">
            <input type="checkbox" id="chk-hotspots" onchange="toggleHotspots(this.checked)"/>
            <span>🚨 Hotspots Only</span>
          </label>
        </div>
      </div>

      <!-- Map Legend -->
      <div class="legend-bar">
        <span class="legend-chip"><span class="legend-color" style="background:#2ECC71;"></span> Excellent (80–100)</span>
        <span class="legend-chip"><span class="legend-color" style="background:#00BFFF;"></span> Good (60–79)</span>
        <span class="legend-chip"><span class="legend-color" style="background:#F39C12;"></span> Needs Improvement (40–59)</span>
        <span class="legend-chip"><span class="legend-color" style="background:#E74C3C;"></span> Poor / Violation (&lt;40)</span>
        <span class="legend-chip"><span class="legend-color" style="background:#6B7280;"></span> No Inspections</span>
      </div>

      <!-- Map + Sidebar Layout -->
      <div class="map-container-layout">
        <div class="map-wrap">
          <div id="map"></div>
        </div>

        <!-- Sidebar List: Stats & Unmapped Buildings -->
        <div class="map-sidebar">
          <div class="map-sidebar-header">
            <span>Spatial Overview</span>
            <span class="badge badge-primary" id="badge-total-count">0 Buildings</span>
          </div>

          <div class="map-sidebar-content">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
              <div style="background:var(--bg-surface-2);padding:10px;border-radius:var(--radius-md);text-align:center;">
                <div style="font-size:1.2rem;font-weight:800;color:var(--color-primary-light);" id="side-mapped-count">0</div>
                <div style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;">Mapped</div>
              </div>
              <div style="background:var(--bg-surface-2);padding:10px;border-radius:var(--radius-md);text-align:center;">
                <div style="font-size:1.2rem;font-weight:800;color:var(--color-warning);" id="side-unmapped-count">0</div>
                <div style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;">Unmapped</div>
              </div>
            </div>

            <div style="font-size:0.8rem;font-weight:700;color:var(--text-secondary);margin-bottom:8px;">
              ⚠️ Location Unavailable (<span id="unmapped-label-count">0</span>)
            </div>
            <div id="unmapped-list" style="color:var(--text-muted);font-size:0.8rem;">
              <div style="padding:12px 0;text-align:center;">No unmapped buildings.</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api/client.js"></script>
  <script src="/js/utils/helpers.js"></script>
  <script src="/js/utils/sidebar.js"></script>
  <script>
    if (!Auth.requireAdmin()) throw new Error();
    injectSidebar('ADMIN');

    let map;
    let markersLayer;
    let hotspotLayer;
    let buildingsData = [];
    let areasData = [];

    function initMap() {
      // Initialize map centered around default coordinates (Mumbai / Pune standard coordinates)
      map = L.map('map', {
        zoomControl: true,
        attributionControl: true
      }).setView([19.0760, 72.8777], 13);

      // OpenStreetMap tiles
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      markersLayer = L.featureGroup().addTo(map);
      hotspotLayer = L.featureGroup().addTo(map);
    }

    async function loadMapData() {
      try {
        const [markers, areas] = await Promise.all([
          api.getMapBuildings(),
          api.getAreas()
        ]);

        buildingsData = markers || [];
        areasData = areas || [];

        populateAreaFilter();
        renderMapMarkers();
        renderUnmappedList();
      } catch (err) {
        Toast.error('Map Error', 'Failed to load map data: ' + err.message);
      }
    }

    function populateAreaFilter() {
      const select = document.getElementById('area-filter');
      select.innerHTML = '<option value="">All Areas</option>' +
        areasData.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');
    }

    function renderMapMarkers() {
      markersLayer.clearLayers();
      hotspotLayer.clearLayers();

      const search = document.getElementById('search-input').value.toLowerCase();
      const areaId = document.getElementById('area-filter').value;
      const status = document.getElementById('status-filter').value;
      const hotspotsOnly = document.getElementById('chk-hotspots').checked;

      let mappedCount = 0;
      let validBounds = [];

      buildingsData.forEach(b => {
        // Filter logic
        const matchSearch = !search || (b.name && b.name.toLowerCase().includes(search)) || (b.areaName && b.areaName.toLowerCase().includes(search));
        const matchArea = !areaId || (b.areaId && String(b.areaId) === String(areaId));
        const matchStatus = !status || (b.complianceStatus === status);
        const isHotspot = (b.complianceScore !== null && b.complianceScore < 50) || b.openViolations >= 1;
        const matchHotspot = !hotspotsOnly || isHotspot;

        if (!matchSearch || !matchArea || !matchStatus || !matchHotspot) return;

        if (b.hasValidCoordinates && b.latitude != null && b.longitude != null) {
          mappedCount++;
          const lat = parseFloat(b.latitude);
          const lng = parseFloat(b.longitude);
          validBounds.push([lat, lng]);

          const score = b.complianceScore !== null ? b.complianceScore : b.latestScore;
          const statusClass = getMarkerClass(b.complianceStatus);
          const isHot = (score !== null && score < 40) || b.openViolations > 0;

          // Custom Marker Icon
          const customIcon = L.divIcon({
            className: 'custom-leaflet-icon',
            html: `<div class="custom-marker ${statusClass} ${isHot ? 'marker-hotspot' : ''}">
                    ${score !== null ? Math.round(score) : '—'}
                   </div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -18]
          });

          const marker = L.marker([lat, lng], { icon: customIcon });

          // Popup content
          const popupHtml = `
            <div class="popup-box">
              <div class="popup-header">
                <div class="popup-title">${escapeHtml(b.name)}</div>
                <div class="popup-sub">${escapeHtml(b.areaName || 'Area')} · ${escapeHtml(b.buildingType || 'Building')}</div>
              </div>
              <div class="popup-row">
                <span class="text-muted">Compliance Score</span>
                <strong>${score !== null ? score + ' / 100' : 'No audits yet'}</strong>
              </div>
              <div class="popup-row">
                <span class="text-muted">Status</span>
                <span class="badge ${getStatusBadge(b.complianceStatus)}">${b.complianceStatus || 'NO_DATA'}</span>
              </div>
              <div class="popup-row">
                <span class="text-muted">Coverage</span>
                <strong>${b.inspectionCoverage !== null ? b.inspectionCoverage + '%' : '0%'}</strong> (${b.inspectedRooms || 0}/${b.totalRooms || 0} rooms)
              </div>
              <div class="popup-row">
                <span class="text-muted">Poor Units</span>
                <span class="${b.poorRoomCount > 0 ? 'text-danger font-bold' : 'text-muted'}">${b.poorRoomCount || 0}</span>
              </div>
              <div class="popup-row">
                <span class="text-muted">Open Violations</span>
                <span class="${b.openViolations > 0 ? 'text-warning font-bold' : 'text-muted'}">${b.openViolations || 0}</span>
              </div>
              <div class="popup-row">
                <span class="text-muted">Last Audit</span>
                <span>${b.lastInspectionDate ? formatDate(b.lastInspectionDate) : 'Never'}</span>
              </div>
              <div class="popup-actions">
                <a href="/admin/areas.html" class="btn btn-secondary btn-sm" style="flex:1;text-align:center;">🔍 Details</a>
                <a href="/admin/inspections.html" class="btn btn-primary btn-sm" style="flex:1;text-align:center;">📋 Audits</a>
              </div>
            </div>
          `;

          marker.bindPopup(popupHtml);
          markersLayer.addLayer(marker);

          // If hotspot, draw glowing danger circle
          if (isHot) {
            const circle = L.circle([lat, lng], {
              radius: 60,
              color: '#E74C3C',
              fillColor: '#E74C3C',
              fillOpacity: 0.15,
              weight: 1
            });
            hotspotLayer.addLayer(circle);
          }
        }
      });

      document.getElementById('side-mapped-count').textContent = mappedCount;
      document.getElementById('badge-total-count').textContent = buildingsData.length + ' Buildings';

      if (validBounds.length > 0) {
        map.fitBounds(validBounds, { padding: [40, 40], maxZoom: 16 });
      }
    }

    function renderUnmappedList() {
      const unmapped = buildingsData.filter(b => !b.hasValidCoordinates || b.latitude == null || b.longitude == null);
      const listEl = document.getElementById('unmapped-list');
      document.getElementById('side-unmapped-count').textContent = unmapped.length;
      document.getElementById('unmapped-label-count').textContent = unmapped.length;

      if (!unmapped.length) {
        listEl.innerHTML = '<div style="padding:16px 0;text-align:center;color:var(--text-muted);">✅ All registered buildings have valid coordinates.</div>';
        return;
      }

      listEl.innerHTML = unmapped.map(b => `
        <div class="unmapped-card">
          <div style="font-weight:700;color:var(--text-primary);margin-bottom:2px;">${escapeHtml(b.name)}</div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:6px;">
            ${escapeHtml(b.areaName || 'No Area')} · ${b.totalRooms || 0} rooms
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="badge ${getStatusBadge(b.complianceStatus)}">${b.complianceStatus || 'NO_DATA'}</span>
            <a href="/admin/areas.html" class="btn btn-secondary btn-sm" style="padding:2px 8px;font-size:0.7rem;">Set Coords</a>
          </div>
        </div>
      `).join('');
    }

    function filterMarkers() {
      renderMapMarkers();
    }

    function toggleHotspots(checked) {
      renderMapMarkers();
    }

    function fitAllMarkers() {
      const valid = buildingsData.filter(b => b.hasValidCoordinates && b.latitude != null && b.longitude != null);
      if (valid.length) {
        const bounds = valid.map(b => [parseFloat(b.latitude), parseFloat(b.longitude)]);
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
      } else {
        Toast.info('Map Notice', 'No buildings with coordinates found.');
      }
    }

    function getMarkerClass(status) {
      if (status === 'EXCELLENT') return 'marker-excellent';
      if (status === 'GOOD') return 'marker-good';
      if (status === 'NEEDS_IMPROVEMENT') return 'marker-needs-imp';
      if (status === 'POOR') return 'marker-poor';
      return 'marker-no-data';
    }

    function getStatusBadge(st) {
      if (st === 'EXCELLENT') return 'badge-success';
      if (st === 'GOOD') return 'badge-info';
      if (st === 'NEEDS_IMPROVEMENT') return 'badge-warning';
      if (st === 'POOR') return 'badge-danger';
      return 'badge-neutral';
    }

    initMap();
    loadMapData();
  </script>
</body>
</html>
