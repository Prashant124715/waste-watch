server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: WasteWatch

  # Datasource Configuration (H2 for local development, easily switchable to PostgreSQL)
  datasource:
    url: jdbc:h2:mem:wastewatchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 

  # H2 Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false

  # JPA & Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Security & JWT Configuration
app:
  jwt:
    # 256-bit secret key for HMAC-SHA256 signature
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.wastewatch: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
