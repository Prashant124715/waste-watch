server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: WasteWatch

  # Default active profile: 'dev' for local development with file-based H2 persistence.
  # Override at runtime with: --spring.profiles.active=test
  profiles:
    active: dev

# Security & JWT Configuration
app:
  jwt:
    # 256-bit secret key for HMAC-SHA256 signature
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.wastewatch: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
